<!DOCTYPE html>
<html lang="ja">
{% load static %}
{% load tz %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'imgs/favicon.png' %}" sizes="image/png">
    <title>民の家＜サービス提供票＞</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --color-primary: #2c3e50;
            --color-primary-hover: #34495e;
            --color-primary-soft: #edf2f6;

            --color-accent: #315b7d;
            --color-text: #303942;
            --color-muted: #6c7884;

            --color-border: #d5dce3;
            --color-border-dark: #aeb8c2;

            --color-background: #f5f7f9;
            --color-surface: #ffffff;
            --color-surface-hover: #f8fafb;

            --color-success: #356348;
            --color-success-bg: #eef6f1;
            --color-success-border: #aac8b5;

            --color-danger: #8a3e3e;
            --color-danger-bg: #fbefef;
            --color-danger-border: #d6aaaa;

            --shadow-small: 0 2px 5px rgba(36, 50, 64, 0.08);
            --shadow-card: 0 5px 18px rgba(36, 50, 64, 0.08);
        }
        body {
            margin: 0;
            padding: 20px;
            color: var(--color-text);
            background-color: var(--color-background);
            font-family: "Meiryo", "メイリオ", "Yu Gothic", "游ゴシック", "Hiragino Sans", sans-serif;
        }
        /* サイドバーの基本設定 */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            width: 50px; /* たたたまれている時はハンバーガーアイコンが見える幅 */
            height: 100vh;
            transition: width 0.3s ease;
            overflow-x: hidden;
            white-space: nowrap;
            background-color: #f8f9fa;
        }

        /* ホバー時に展開 */
        #sidebar:hover {
            width: 240px; /* 展開時の幅 */
        }

        /* アイコン自体の固定幅と位置調整 */
        .icon-width {
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ハンバーガーアイコンの表示スタイル */
        .sidebar-toggle-icon {
            width: 20px;
            text-align: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #495057;
        }

        /* 閉じている時はテキストを隠す */
        .sidebar-text {
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        /* サイドバーが開いた時のみテキストを表示 */
        #sidebar:hover .sidebar-text {
            opacity: 1;
            pointer-events: auto;
        }

    </style>
    {% block css %}
    {% endblock css %}
</head>

<body>
    <script type="module" src="{% static 'dashboard/js/breadcrumb.js' %}"></script>
    {% block script %}
    {% endblock script %}
    <div class="position-relative">
        <!-- サイドバー -->
        <div id="sidebar">
            {% include "dashboard/components/sidebar.html" %}
        </div>

        <!-- メインコンテンツ -->
        <main id="main-content" class="flex-grow-1 p-4 bg-light">
            {% block body %}
            {% endblock body%}
        </main>
    </div>
</body>

</html>
