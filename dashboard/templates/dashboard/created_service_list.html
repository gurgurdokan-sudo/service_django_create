{% extends "dashboard/base/base.html" %}
{% block css %}
{% load static %}
<link rel="stylesheet" href="{% static 'dashboard/css/created.css' %}">
<style>

.link-name {
  color: inherit; /* 通常時の文字色 */
  text-decoration: underline; /* 下線 */
  transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
}

</style>
{% endblock css %}

{% block body %}
<div class="container">
  <div id="bread" class="ms-2" data-items='{{ breadcrumbs|safe }}'></div>
  <body>
    <form id="csrf-token-form" hidden>
      {% csrf_token %}
    </form>
    <div id="root"></div>
  </body>
</div>
{% endblock %}

{% block script %}
{% load static %}
<script type="module" src="{% static 'dashboard/js/createdServiceList.js' %}"></script>
{% endblock script %}
