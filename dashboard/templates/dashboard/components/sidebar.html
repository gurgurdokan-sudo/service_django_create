{% block css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endblock css %}
<div id="sidebar">

    <nav class="bg-light border-end" style="width: 240px; min-height: 100vh;">
      <div class="sidebar-header p-3 border-bottom d-flex align-items-center">
        <i class="fa-solid fa-bars fa-lg sidebar-toggle-icon"></i>
        <h5 class="mb-0 ms-3 sidebar-text">メニュー</h5>
      </div>

    <div class="list-group list-group-flush">
      <a href="{% url 'dashboard:user_list' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-users icon-width"></i>
        <span class="sidebar-text ms-3">利用者一覧</span>
      </a>

      <a href="{% url 'dashboard:care_mana_list' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-user-tie icon-width"></i>
        <span class="sidebar-text ms-3">ケアマネジャー一覧</span>
      </a>

      <a href="{% url 'employees:employee_list' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-id-card icon-width"></i>
        <span class="sidebar-text ms-3">スタッフ一覧</span>
      </a>

      <a href="{% url 'employees:calendar' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-calendar-days icon-width"></i>
        <span class="sidebar-text ms-3">スケジュールカレンダー</span>
      </a>

      <a href="{% url 'employees:unsubmitted_reports' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-triangle-exclamation icon-width"></i>
        <span class="sidebar-text ms-3">日報未提出一覧</span>
      </a>

      <a href="{% url 'employees:attendance_list' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-clock-rotate-left icon-width"></i>
        <span class="sidebar-text ms-3">出退勤記録</span>
      </a>

      <a href="{% url 'dashboard:created_service_list' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-file-invoice icon-width"></i>
        <span class="sidebar-text ms-3">国保連請求CSV</span>
      </a>

      <a href="{% url 'diary:list' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-book icon-width"></i>
        <span class="sidebar-text ms-3">日報一覧</span>
      </a>

      <a href="{% url 'dashboard:office_setting' %}" class="list-group-item list-group-item-action d-flex align-items-center">
        <i class="fa-solid fa-gear icon-width"></i>
        <span class="sidebar-text ms-3">事務所設定</span>
      </a>

      <form method="post" action="{% url 'logout' %}" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="list-group-item list-group-item-action text-danger w-100 text-start d-flex align-items-center">
          <i class="fa-solid fa-right-from-bracket icon-width"></i>
          <span class="sidebar-text ms-3">
            ログアウト{% if request.user.is_authenticated %}（{{ request.user }}）{% endif %}
          </span>
        </button>
      </form>
    </div>
  </nav>
</div>
